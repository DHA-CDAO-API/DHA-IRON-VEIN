kind = "web"
previewPath = "/"
title = "INDOPACOM Predictive Sustainment"
version = "1.0.0"
id = "artifacts/command"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24576

[services.development]
run = "pnpm --filter @workspace/command run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/command", "run", "build" ]
publicDir = "artifacts/command/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24576"
BASE_PATH = "/"
