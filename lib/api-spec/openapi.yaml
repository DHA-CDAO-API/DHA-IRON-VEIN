        nodeId: { type: string }
        nodeName: { type: string }
        itemId: { type: string }
        itemName: { type: string }
        quantity: { type: number }
        priority: { type: string }
        rationale: { type: string }
        suggestedSupplierId: { type: ["string", "null"] }
        suggestedSupplierName: { type: ["string", "null"] }
        suggestedFromNodeId: { type: ["string", "null"] }
        etaDays: { type: number }
        estimatedCost: { type: number }
        generatedAt: { type: string, format: date-time }
        confidenceScore: { type: number }
        scenarioId: { type: ["string", "null"] }
        promotedOrderId: { type: ["string", "null"] }

    ForecastInput:
      type: object
      required: [itemIds, nodeIds, horizonDays]
      properties:
        itemIds:
          type: array
