      properties:
        id: { type: string }
        name: { type: string }
        unit: { type: string }
        unitOfIssue: { type: string }
        category:
          type: string
          enum: [blood_products, supplies, other]
          description: Top-level grouping for medical-logistics catalog
        classOfSupply: { type: string }
        criticality: { type: string }
        usagePerDraw: { type: number }
        usageRate: { type: number }
        demandBasis: { type: string }
        skewFactor: { type: number }
        leadTimeDays: { type: number }
        shelfLifeDays: { type: number }
        baseDemandPerEvent: { type: number }
        wasteAdjustedDemand: { type: number }
        trigger: { type: string }
        niinOrSku: { type: string }

    ItemDetail:
      type: object
      required: [item, totalOnHand, networkDaysOfSupply, perNode, suppliers, alerts, recommendations]
      properties:
        item: { $ref: "#/components/schemas/Item" }
