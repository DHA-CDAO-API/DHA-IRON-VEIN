        provider: { type: ["string", "null"], enum: [openai, anthropic, null] }
        model: { type: ["string", "null"] }
        autoFlyEnabled: { type: ["boolean", "null"] }
        autoFlyIntervalSec: { type: ["integer", "null"] }
        operationalState: { type: ["string", "null"] }
        warnDays: { type: ["number", "null"] }
        criticalDays: { type: ["number", "null"] }
        dmlssCompatible: { type: ["boolean", "null"] }
        dmlssEndpoint: { type: ["string", "null"] }
        dmlssApiKey: { type: ["string", "null"] }
        timezone: { type: ["string", "null"] }

