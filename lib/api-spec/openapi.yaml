        itemName: { type: string }
        unit: { type: string }
        criticality: { type: string }
        quantityOnHand: { type: number }
        dailyBurn: { type: number }
        daysOfSupply: { type: number }
        status: { type: string, enum: [healthy, watch, warn, critical] }

    Supplier:
      type: object
      required: [id, name, region, leadTimeDays, reliability, costIndex, channel]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        countryCode: { type: string }
        leadTimeDays: { type: number }
        reliability: { type: number }
        costIndex: { type: number }
        channel: { type: string }
        items:
          type: array
          items: { type: string }
        notes: { type: ["string", "null"] }

    Order:
      type: object
      required: [id, orderNumber, status, fromNodeId, toNodeId, supplierId, itemId, quantity, priority, etaDays, totalCost, createdAt]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status: { type: string }
        fromNodeId: { type: string }
        fromNodeName: { type: ["string", "null"] }
        toNodeId: { type: string }
        toNodeName: { type: ["string", "null"] }
        supplierId: { type: ["string", "null"] }
        supplierName: { type: ["string", "null"] }
        itemId: { type: string }
        itemName: { type: string }
        unit: { type: ["string", "null"] }
        quantity: { type: number }
        priority: { type: string }
        etaDays: { type: number }
        requestedDeliveryAt: { type: ["string", "null"], format: date-time }
        totalCost: { type: number }
        rationale: { type: ["string", "null"] }
        triggerNote: { type: ["string", "null"] }
        triggerSource: { type: ["string", "null"], description: "ai | manual | system" }
        createdAt: { type: string, format: date-time }
        createdByRole: { type: ["string", "null"] }
        sourceRecommendationId: { type: ["string", "null"] }

    OrderLineDetail:
      type: object
      required: [id, itemId, quantity, unitPriceUsd, lineTotalUsd]
      properties:
        id: { type: ["string", "integer"] }
        itemId: { type: string }
        itemName: { type: ["string", "null"] }
        unit: { type: ["string", "null"] }
        quantity: { type: number }
        unitPriceUsd: { type: number }
        lineTotalUsd: { type: number }
        itemMissing:
          type: boolean
          description: True when this line's itemId has no matching row in the catalog. The UI should render a non-clickable placeholder rather than an /items/:id link.

    OrderDetail:
      type: object
      required: [order, fromNode, toNode, item]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        fromNode: { $ref: "#/components/schemas/Node" }
        toNode: { $ref: "#/components/schemas/Node" }
        item: { $ref: "#/components/schemas/Item" }
        itemMissing:
          type: boolean
          description: True when the order's first line itemId has no matching row in the catalog. The `item` field is then a synthesized placeholder so the page can degrade gracefully.
        supplier: { $ref: "#/components/schemas/Supplier" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLineDetail" }
        recommendation: { $ref: "#/components/schemas/Recommendation" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/ActivityEntry" }
        shipments:
          type: array
          description: Per-shipment progress derived from the shipments table and the SHIPMENT_* activity entries. Empty until the order transitions to IN_TRANSIT.
          items: { $ref: "#/components/schemas/OrderShipmentProgress" }

    OrderShipmentProgress:
      type: object
      required: [id, itemId, quantity, status, departedAt, etaAt]
      properties:
        id: { type: string }
        itemId: { type: string }
        itemName: { type: ["string", "null"] }
        unit: { type: ["string", "null"] }
        quantity: { type: number }
        status:
          type: string
          enum: [DEPARTED, IN_TRANSIT, DELIVERED]
          description: Latest milestone for this shipment. DEPARTED means it just left the source, IN_TRANSIT means it's en route (departedAt has elapsed), DELIVERED means a SHIPMENT_DELIVERED activity entry exists.
        departedAt: { type: string, format: date-time }
        etaAt: { type: string, format: date-time }
        deliveredAt: { type: ["string", "null"], format: date-time }

    CreateOrderInput:
      type: object
      required: [toNodeId, itemId, quantity, priority]
      properties:
        toNodeId: { type: string }
        fromNodeId: { type: ["string", "null"] }
