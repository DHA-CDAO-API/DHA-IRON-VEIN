        fpconLatency: { type: number }
        latencyMultiplier: { type: number }
        reliabilityPenalty: { type: number }
        inventoryRetained: { type: number }

    Scenario:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        createdByRole: { type: ["string", "null"] }

    RunScenarioInput:
      type: object
      required: [name, eventId, focusNodeIds, horizonDays]
