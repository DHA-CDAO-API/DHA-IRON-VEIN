        affectedNodes:
          type: array
          items: { type: string }
        zoneIds:
          type: array
          description: Operator-drawn theater zone IDs. The runner expands these into affected nodes (any node inside any referenced zone) and applies route delays/reliability hits to routes crossing them.
          items: { type: string }
        encounterMultiplier: { type: number }
        populationMultiplier: { type: number }
        wasteMultiplier: { type: number }
        routeReliabilityDelta: { type: number }
        routeDelayDays: { type: number }
        specimensMultiplier: { type: number }
        itemSkew:
          type: object
          additionalProperties: { type: number }

    Scenario:
      type: object
      required: [id, name, status, createdAt]
      properties:
