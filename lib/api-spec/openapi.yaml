        eventId: { type: string }
        focusNodeIds:
          type: array
          items: { type: string }
        horizonDays: { type: integer }
        summary: { type: string }
        operationalState: { type: ["string", "null"] }
        perturbation: { $ref: "#/components/schemas/EventParameters" }
        generateBrief: { type: boolean }

    UpdateScenarioInput:
      type: object
      properties:
        name: { type: string }
      required: [name]

    ScenarioResult:
      type: object
