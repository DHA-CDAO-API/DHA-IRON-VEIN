openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Predictive Sustainment Platform API for INDOPACOM medical logistics decision support.
servers:
  - url: /api
tags:
  - name: health
  - name: catalog
  - name: network
  - name: sites
  - name: items
  - name: inventory
  - name: suppliers
  - name: orders
  - name: alerts
  - name: scenarios
  - name: predictive
  - name: copilot
  - name: settings
  - name: profile
  - name: dashboard
  - name: admin
  - name: activity
  - name: blood

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"

  /admin/seed-status:
    get:
      operationId: getSeedStatus
      tags: [admin]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedStatus" }
  /admin/reseed:
    post:
      operationId: reseedDatabase
      tags: [admin]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedStatus" }

  /catalog/items:
    get:
      operationId: listCatalogItems
      tags: [catalog]
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogPage" }

  /network/nodes:
    get:
      operationId: listNodes
      tags: [network]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Node" }
  /network/routes:
    get:
      operationId: listRoutes
      tags: [network]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }
  /network/snapshot:
    get:
      operationId: getNetworkSnapshot
      tags: [network]
      description: Live network snapshot — nodes, routes, in-flight shipments, threat overlays, theater zones, and per-node risk score.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkSnapshot" }

  /network/zones:
    get:
      operationId: listTheaterZones
      tags: [network]
      description: List operator-drawn theater zones (no-fly boxes, contested corridors, humanitarian AOs).
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TheaterZone" }
    post:
      operationId: createTheaterZone
      tags: [network]
      description: Persist a new operator-drawn theater zone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTheaterZoneInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TheaterZone" }
  /network/zones/{zoneId}:
    delete:
      operationId: deleteTheaterZone
      tags: [network]
      parameters:
        - in: path
          name: zoneId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: deleted

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteSummary" }
  /sites/{nodeId}:
    get:
      operationId: getSiteDetail
      tags: [sites]
      parameters:
        - in: path
          name: nodeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }

  /items:
    get:
      operationId: listItems
      tags: [items]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
  /items/{itemId}:
    get:
      operationId: getItemDetail
      tags: [items]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }

  /inventory/balances:
    get:
      operationId: listInventoryBalances
      tags: [inventory]
      parameters:
        - in: query
          name: nodeId
          schema: { type: string }
        - in: query
          name: itemId
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryBalance" }

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Supplier" }

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: nodeId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatusInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: severity
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }
  /alerts/{alertId}/ack:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcknowledgeAlertInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }

  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scenario" }
    post:
      operationId: runScenario
      tags: [scenarios]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunScenarioInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioResult" }
  /scenarios/{scenarioId}:
    get:
      operationId: getScenario
      tags: [scenarios]
      parameters:
        - in: path
          name: scenarioId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioResult" }
    patch:
      operationId: updateScenario
      tags: [scenarios]
      summary: Rename or update metadata for a saved scenario run.
      parameters:
        - in: path
          name: scenarioId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateScenarioInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scenario" }
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a saved scenario run and its associated recommendations.
      parameters:
        - in: path
          name: scenarioId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: deleted
  /scenarios/preview:
    post:
      operationId: previewScenario
      tags: [scenarios]
      summary: Run a scenario simulation without persisting it (used for live custom-builder preview).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunScenarioInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioResult" }
  /scenarios/preset-events:
    get:
      operationId: listPresetEvents
      tags: [scenarios]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PresetEvent" }

  /predictive/forecast:
    post:
      operationId: forecastDemand
      tags: [predictive]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForecastInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastResult" }
  /predictive/recommendations:
    get:
      operationId: getRecommendations
      tags: [predictive]
      parameters:
        - in: query
          name: nodeId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recommendation" }
  /predictive/recommendations/{recommendationId}/promote:
    post:
      operationId: promoteRecommendationToOrder
      tags: [predictive]
      parameters:
        - in: path
          name: recommendationId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoteRecommendationOverrides" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /copilot/conversations:
    get:
      operationId: listConversations
      tags: [copilot]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Conversation" }
    post:
      operationId: createConversation
      tags: [copilot]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
  /copilot/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [copilot]
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetail" }
  /copilot/conversations/{conversationId}/messages:
    post:
      operationId: sendCopilotMessage
      tags: [copilot]
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCopilotMessageInput" }
      responses:
        "200":
          description: SSE stream of tokens
          content:
            text/event-stream:
              schema: { type: string }

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
    patch:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettingsInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    patch:
      operationId: updateProfile
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /profile/roles:
    get:
      operationId: listRoles
      tags: [profile]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleDefinition" }

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardOverview" }
  /dashboard/risk:
    get:
      operationId: getRiskBoard
      tags: [dashboard]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskBoard" }

  /sites/{nodeId}/blood-readiness:
    get:
      operationId: getNodeBloodReadiness
      tags: [blood]
      parameters:
        - in: path
          name: nodeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeBloodReadiness" }
        "404":
          description: node not found

  /dashboard/blood-readiness:
    get:
      operationId: getTheaterBloodReadiness
      tags: [blood]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TheaterBloodReadiness" }

  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEntry" }

  /overview/cascade:
    get:
      operationId: getOverviewCascade
      tags: [overview]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CascadeAnalysis" }

  /overview/leaderboard:
    get:
      operationId: getOverviewLeaderboard
      tags: [overview]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 8 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessLeaderboard" }

  /overview/cold-chain-pulse:
    get:
      operationId: getOverviewColdChainPulse
      tags: [overview]
      parameters:
        - in: query
          name: windowMinutes
          schema: { type: integer, default: 60 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColdChainPulse" }

  /overview/activity-stream:
    get:
      operationId: getOverviewActivityStream
      tags: [overview]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 5, maximum: 60 }
        - in: query
          name: cursor
          description: ISO timestamp from a previous response's `nextCursor`. Returns items strictly older than this timestamp.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewActivityStream" }

  /overview/mission-risk-matrix:
    get:
      operationId: getOverviewMissionRiskMatrix
      tags: [overview]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionRiskMatrix" }

  /overview/ai-brief:
    get:
      operationId: getOverviewAiBrief
      tags: [overview]
      parameters:
        - in: query
          name: refresh
          description: When "true", bypass the server-side cache and force regeneration.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiOverviewBrief" }

components:
  schemas:
    HealthCheckResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    SeedStatus:
      type: object
      required: [seeded, items, nodes, routes, balances, orders]
      properties:
        seeded: { type: boolean }
        items: { type: integer }
        nodes: { type: integer }
        routes: { type: integer }
        balances: { type: integer }
        orders: { type: integer }
        suppliers: { type: integer }
        catalogEntries: { type: integer }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }

    CatalogEntry:
      type: object
      required: [mfrCatNo, description, manufacturer, productNoun, productType]
      properties:
        mfrCatNo: { type: string }
        appItemId: { type: ["string", "null"] }
        mapped: { type: boolean }
        orderLines: { type: integer }
        totalQty: { type: number }
        description: { type: string }
        manufacturer: { type: string }
        productNoun: { type: string }
        productType: { type: string }
        unspscCommodity: { type: ["string", "null"] }
        productSize: { type: ["string", "null"] }
        ghxCommodityType: { type: ["string", "null"] }
        fullDescription: { type: ["string", "null"] }

    CatalogPage:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogEntry" }

    Node:
      type: object
      required: [id, name, type, latitude, longitude, population, optempo, stockDays]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        population: { type: integer }
        optempo: { type: string }
        stockDays: { type: integer }
        regionalHub: { type: ["string", "null"] }
        upstreamNode: { type: ["string", "null"] }
        countryCode: { type: ["string", "null"] }

    Route:
      type: object
      required: [id, fromNode, toNode, priority, days, reliability]
      properties:
        id: { type: string }
        fromNode: { type: string }
        toNode: { type: string }
        priority: { type: string, enum: [primary, secondary, tertiary] }
        days: { type: number }
        reliability: { type: number }
        modality: { type: string }
        categories:
          type: array
          description: Categories of supply that this route is currently carrying (derived from in-flight shipments + recent orders).
          items: { type: string, enum: [blood_products, supplies, ppe, other] }

    InFlightShipment:
      type: object
      required: [id, fromNode, toNode, itemId, quantity, etaDays, progress]
      properties:
        id: { type: string }
        orderId:
          type: ["string", "null"]
          description: ID of the originating order, when this shipment was generated from one (used for click-through navigation from the live map).
        fromNode: { type: string }
        toNode: { type: string }
        itemId: { type: string }
        itemName: { type: string }
        quantity: { type: number }
        etaDays: { type: number }
        progress: { type: number, description: "0..1" }
        priority: { type: string }
        category:
          type: string
          enum: [blood_products, supplies, ppe, other]
          description: Top-level category of the item being shipped

    ThreatOverlay:
      type: object
      required: [id, label, severity, polygon]
      properties:
        id: { type: string }
        label: { type: string }
        severity: { type: string }
        polygon:
          type: array
          items:
            type: array
            items: { type: number }

    TheaterZone:
      type: object
      required: [id, name, severity, kind, polygon, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        severity:
          type: string
          enum: [WATCH, WARNING, CRITICAL]
        kind:
          type: string
          description: "Free-form classification (e.g. no_fly, contested_corridor, humanitarian, custom)"
        polygon:
          type: array
          description: Closed polygon as an array of [longitude, latitude] pairs.
          items:
            type: array
            items: { type: number }
        notes: { type: ["string", "null"] }
        createdBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    CreateTheaterZoneInput:
      type: object
      required: [name, polygon]
      properties:
        name: { type: string }
        severity:
          type: string
          enum: [WATCH, WARNING, CRITICAL]
        kind: { type: string }
        polygon:
          type: array
          items:
            type: array
            items: { type: number }
        notes: { type: ["string", "null"] }
        createdBy: { type: ["string", "null"] }

    NetworkSnapshot:
      type: object
      required: [nodes, routes, shipments, riskByNode, threats, generatedAt, focusedHubId]
      properties:
        generatedAt: { type: string, format: date-time }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Node" }
        routes:
          type: array
          items: { $ref: "#/components/schemas/Route" }
        shipments:
          type: array
          items: { $ref: "#/components/schemas/InFlightShipment" }
        riskByNode:
          type: array
          items:
            type: object
            required: [nodeId, riskScore, daysOfSupply, openAlerts]
            properties:
              nodeId: { type: string }
              riskScore: { type: number }
              daysOfSupply: { type: number }
              openAlerts: { type: integer }
              criticalShortItems: { type: integer }
              tier:
                type: string
                enum: [nominal, heightened, critical]
                description: Threat tier derived from risk score and open alert severity
              dosByCategory:
                type: object
                description: Minimum days-of-supply for items in each category at this node
                additionalProperties: { type: number }
              topCriticalItems:
                type: array
                description: Top 3 most-critical items at this node by lowest DOS
                items:
                  type: object
                  required: [itemId, itemName, daysOfSupply]
                  properties:
                    itemId: { type: string }
                    itemName: { type: string }
                    category: { type: string }
                    daysOfSupply: { type: number }
                    onHand: { type: number }
              lastShipmentInAt: { type: ["string", "null"], format: date-time }
              lastShipmentOutAt: { type: ["string", "null"], format: date-time }
        threats:
          type: array
          items: { $ref: "#/components/schemas/ThreatOverlay" }
        zones:
          type: array
          description: Operator-drawn theater zones (no-fly, contested corridor, humanitarian AO, etc.).
          items: { $ref: "#/components/schemas/TheaterZone" }
        aorBoundary:
          type: array
          description: Polygon (lon,lat pairs) outlining the USINDOPACOM area of responsibility
          items:
            type: array
            items: { type: number }
        focusedHubId: { type: ["string", "null"] }
        operationalState: { type: string }
        bloodReadinessByNode:
          type: array
          description: |
            Lightweight per-node viable blood-DOS roll-up used to power
            map-side blood-readiness widgets. Only includes nodes that hold
            blood (i.e. have at least one viable lot or a configured donor
            pool). Does not include cold-chain or donor detail — those live
            on the per-site bloodReadiness object.
          items:
            type: object
            required: [nodeId, viableDaysOfSupply, totalViableUnits, tier]
            properties:
              nodeId: { type: string }
              viableDaysOfSupply:
                type: number
                description: |
                  Days of supply against current blood-products demand using
                  only units that will remain transfusable through the
                  lead-time window (excludes lots expiring within 7 days).
              totalViableUnits: { type: integer }
              unitsExpiringWithin72h: { type: integer }
              tier:
                type: string
                enum: [nominal, heightened, critical]
                description: Tier derived from viableDaysOfSupply.

    SiteSummary:
      type: object
      required: [nodeId, name, type, daysOfSupply, openAlerts, riskScore]
      properties:
        nodeId: { type: string }
        name: { type: string }
        type: { type: string }
        regionalHub: { type: ["string", "null"] }
        daysOfSupply: { type: number }
        openAlerts: { type: integer }
        riskScore: { type: number }
        criticalShortItems: { type: integer }
        latitude: { type: number }
        longitude: { type: number }

    SiteDetail:
      type: object
      required: [node, balances, alerts, recentOrders, demandProfile, dosByItem, recommendations]
      properties:
        node: { $ref: "#/components/schemas/Node" }
        demandProfile: { $ref: "#/components/schemas/DemandProfile" }
        balances:
          type: array
          items: { $ref: "#/components/schemas/InventoryBalance" }
        dosByItem:
          type: array
          items: { $ref: "#/components/schemas/DaysOfSupplyEntry" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        history:
          type: array
          items: { $ref: "#/components/schemas/HistoryPoint" }
        bloodReadiness:
          oneOf:
            - { $ref: "#/components/schemas/NodeBloodReadiness" }
            - { type: "null" }
          description: |
            Per-site blood-products roll-up. Null when the node holds no blood
            (e.g. suppliers / prime vendors).

    DemandProfile:
      type: object
