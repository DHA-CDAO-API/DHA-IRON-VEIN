    ScenarioResult:
      type: object
      required: [scenario, summary, perNode, perItem, recommendations, timeline]
      properties:
        scenario: { $ref: "#/components/schemas/Scenario" }
        summary: { $ref: "#/components/schemas/ScenarioSummary" }
        perNode:
          type: array
          items: { $ref: "#/components/schemas/ScenarioNodeOutcome" }
        perItem:
          type: array
          items: { $ref: "#/components/schemas/ScenarioItemOutcome" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/ScenarioTimelinePoint" }
