      required: [id, kind, summary, createdAt]
      properties:
        id: { type: string }
        kind: { type: string }
        summary: { type: string }
        nodeId: { type: ["string", "null"] }
        itemId: { type: ["string", "null"] }
        orderId: { type: ["string", "null"] }
        scenarioId: { type: ["string", "null"] }
        actorRole: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    BloodViabilityRow:
      type: object
      required: [component, viableUnits, nearExpiryUnits, expiredUnits, compromisedUnits]
      properties:
        component:
          type: string
          description: LTOWB | PRBC | FFP | PLASMA | PLATELETS | CRYO | FDP
        aboGroup: { type: ["string", "null"], description: "O | A | B | AB | null" }
        rhFactor: { type: ["string", "null"], description: "POS | NEG | null" }
        viableUnits: { type: integer, description: Units that are still transfusable (includes near-expiry) }
        nearExpiryUnits: { type: integer, description: Units expiring within 72 h }
        expiredUnits: { type: integer }
        compromisedUnits: { type: integer, description: Units flagged COMPROMISED (cold-chain failure, contamination, etc.) }

    ColdChainAssetView:
      type: object
      required: [id, assetType, name, status, currentTempC, hasGenerator, fuelDaysRemaining]
      properties:
        id: { type: string }
        assetType:
          type: string
          enum: [refrigerator, freezer, cryopreserver, platelet_incubator, transport_cooler, generator]
        name: { type: string }
        status: { type: string, enum: [NOMINAL, EXCURSION, FAILED] }
        currentTempC: { type: number }
        targetTempMinC: { type: number }
        targetTempMaxC: { type: number }
        hasGenerator: { type: boolean }
        fuelDaysRemaining: { type: number }
        capacityUnits: { type: integer }
        lastCheckedAt: { type: string, format: date-time }

    TestingSupplyView:
      type: object
      required: [itemId, itemName, onHand, dailyBurn, daysOfSupply, constrains, isConstraint]
      properties:
        itemId: { type: string }
        itemName: { type: string }
        onHand: { type: number }
        dailyBurn: { type: number }
        daysOfSupply: { type: number }
        constrains:
          type: string
          enum: [collection, transfusion, both]
          description: Whether this reagent gates donor qualification, transfusion, or both.
        isConstraint:
          type: boolean
          description: True when this item's DOS is at or below the critical threshold.

    WbbReadyByType:
      type: object
      required: [oPos, oNeg, aPos, aNeg, bPos, bNeg, abPos, abNeg, total]
      properties:
        oPos: { type: integer }
        oNeg: { type: integer }
        aPos: { type: integer }
        aNeg: { type: integer }
        bPos: { type: integer }
        bNeg: { type: integer }
        abPos: { type: integer }
        abNeg: { type: integer }
        total: { type: integer }

    TemperatureEventView:
      type: object
      required: [id, assetId, nodeId, occurredAt, recordedTempC, severity]
      properties:
        id: { type: integer }
        assetId: { type: string }
        nodeId: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedTempC: { type: number }
        severity: { type: string, enum: [WATCH, WARNING, CRITICAL] }
        resolvedAt: { type: ["string", "null"], format: date-time }
        notes: { type: string }

    NodeBloodReadiness:
      type: object
      required:
        - nodeId
        - totalViableUnits
        - unitsExpiringWithin24h
        - unitsExpiringWithin72h
        - unitsExpiringWithin7d
        - viableDaysOfSupply
        - viability
        - coldChain
        - donors
        - testingSupplies
      properties:
        nodeId: { type: string }
        totalViableUnits: { type: integer }
        unitsExpiringWithin24h: { type: integer }
        unitsExpiringWithin72h: { type: integer }
        unitsExpiringWithin7d: { type: integer }
        viableDaysOfSupply:
          type: number
          description: |
            Days of supply against blood-product demand using only units that
            will still be transfusable through the relevant lead-time window
            (i.e. lots expiring within 7 days are excluded).
        viability:
          type: array
          items: { $ref: "#/components/schemas/BloodViabilityRow" }
        coldChain:
          type: object
          required: [assets, healthPercent, activeExcursions, failedAssets, minFuelDaysRemaining]
          properties:
            assets:
              type: array
              items: { $ref: "#/components/schemas/ColdChainAssetView" }
            healthPercent:
              type: number
              description: 0–100 percent health across this node's storage assets.
            activeExcursions: { type: integer }
            failedAssets: { type: integer }
            minFuelDaysRemaining: { type: number }
        donors:
          type: object
          required: [eligibleDonors, weeklyCollectionCapacity, effectiveCollectionCapacity, wbbReady]
          properties:
            eligibleDonors: { type: integer }
            weeklyCollectionCapacity: { type: integer }
            effectiveCollectionCapacity:
              type: integer
              description: Collection capacity haircut by current reagent/kit availability.
            wbbReady: { $ref: "#/components/schemas/WbbReadyByType" }
            lastDriveAt: { type: ["string", "null"], format: date-time }
        testingSupplies:
          type: object
          required: [items, minDaysOfSupply, constraintsCollection, constraintsTransfusion]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/TestingSupplyView" }
            minDaysOfSupply: { type: number }
            constraintsCollection: { type: boolean }
            constraintsTransfusion: { type: boolean }
        recentTemperatureEvents:
          type: array
          items: { $ref: "#/components/schemas/TemperatureEventView" }

    TheaterBloodReadiness:
      type: object
      required:
        - totalViableUnits
        - unitsExpiringWithin24h
        - unitsExpiringWithin72h
        - unitsExpiringWithin7d
        - coldChainHealthPercent
        - coldChainAssetsTotal
        - coldChainAssetsExcursion
        - coldChainAssetsFailed
        - walkingBloodBankReadyDonors
        - reagentDaysRemaining
        - nodesWithBlood
        - nodesWithCriticalShortage
      properties:
        totalViableUnits: { type: integer }
        unitsExpiringWithin24h: { type: integer }
        unitsExpiringWithin72h: { type: integer }
        unitsExpiringWithin7d: { type: integer }
        coldChainHealthPercent: { type: number }
        coldChainAssetsTotal: { type: integer }
        coldChainAssetsExcursion: { type: integer }
        coldChainAssetsFailed: { type: integer }
        walkingBloodBankReadyDonors: { type: integer }
        reagentDaysRemaining:
          type: number
          description: Minimum days-of-supply across critical reagents/kits across all blood-storing nodes.
        nodesWithBlood: { type: integer }
        nodesWithCriticalShortage:
          type: integer
          description: Number of blood-storing nodes whose reagent DOS is at or below the critical threshold.

    CascadeAnalysis:
      type: object
      required: [generatedAt, scenarios]
      properties:
        generatedAt: { type: string, format: date-time }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/CascadeScenario" }

    CascadeScenario:
      type: object
      required:
        - id
        - triggerType
        - triggerNodeId
        - triggerNodeName
        - triggerLabel
        - severity
        - confidence
        - affectedSiteCount
        - affectedSiteIds
        - affectedSiteNames
        - affectedSpokes
        - projectedDosImpact
        - leadTimeImpactHours
        - narrative
      properties:
        id: { type: string }
        triggerType:
          type: string
          enum: [hub_loss, generator_failure, route_interdiction]
        triggerNodeId: { type: string }
        triggerNodeName: { type: string }
        triggerLabel: { type: string }
        severity: { type: string, enum: [NOMINAL, WATCH, CRITICAL] }
        confidence:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          description: Confidence in the scenario projection based on data coverage.
        affectedSiteCount: { type: integer }
        affectedSiteIds:
          type: array
          items: { type: string }
        affectedSiteNames:
          type: array
          items: { type: string }
        affectedSpokes:
          type: array
          description: Per-site projection for each affected spoke.
          items: { $ref: "#/components/schemas/CascadeAffectedSpoke" }
        projectedDosImpact:
          type: number
          description: Estimated days-of-supply impact across affected sites.
        leadTimeImpactHours: { type: integer }
        narrative: { type: string }

    CascadeAffectedSpoke:
      type: object
      required:
        - nodeId
        - nodeName
        - currentDaysOfSupply
        - projectedDaysOfSupply
        - tier
      properties:
        nodeId: { type: string }
        nodeName: { type: string }
        currentDaysOfSupply:
          type: number
          description: Current organic days of supply at this spoke.
        projectedDaysOfSupply:
          type: number
          description: Projected days of supply after the cascade event.
        tier: { type: string, enum: [NOMINAL, WATCH, CRITICAL] }

    ReadinessLeaderboard:
      type: object
      required: [generatedAt, entries]
      properties:
        generatedAt: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ReadinessLeaderboardEntry" }

    ReadinessLeaderboardEntry:
      type: object
      required:
        - nodeId
        - nodeName
        - nodeType
        - viableUnits
        - viableDaysOfSupply
        - daysUntilStockout
        - deltaDosVs24h
        - hasBaseline
        - tier
        - sparkline
        - deeplink
      properties:
        nodeId: { type: string }
        nodeName: { type: string }
        nodeType: { type: string }
        regionalHub: { type: ["string", "null"] }
        viableUnits: { type: integer }
        viableDaysOfSupply: { type: number }
        daysUntilStockout: { type: number }
        deltaDosVs24h:
          type: number
          description: Change in viable days-of-supply versus the previous ~24h snapshot for this site.
        hasBaseline:
          type: boolean
          description: True when a previous snapshot exists; when false the delta is 0 and the UI should render an em-dash.
        tier: { type: string, enum: [NOMINAL, WATCH, CRITICAL] }
        sparkline:
          type: array
          items: { $ref: "#/components/schemas/HistoryPoint" }
        constraintCategory:
          type: ["string", "null"]
          description: Primary constraint at this site (cold_chain, reagents, blood, donors, or null).
        deeplink:
          type: string
          description: Path to the site's Blood Readiness tab.

    ColdChainPulse:
      type: object
      required: [generatedAt, windowMinutes, events]
      properties:
        generatedAt: { type: string, format: date-time }
        windowMinutes: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/ColdChainPulseEvent" }

    ColdChainPulseEvent:
      type: object
      required:
        - id
        - occurredAt
        - assetId
        - assetName
        - assetType
        - nodeId
        - nodeName
        - severity
        - recordedTempC
        - targetTempMinC
        - targetTempMaxC
        - peakTempDeltaC
        - recovered
        - affectedUnits
        - notes
      properties:
        id: { type: integer }
        occurredAt: { type: string, format: date-time }
        assetId: { type: string }
        assetName: { type: string }
        assetType: { type: string }
        nodeId: { type: string }
        nodeName: { type: string }
        severity: { type: string, enum: [WATCH, WARNING, CRITICAL] }
        recordedTempC: { type: number }
        targetTempMinC: { type: number }
        targetTempMaxC: { type: number }
        peakTempDeltaC: { type: number }
        recovered: { type: boolean }
        resolvedAt: { type: ["string", "null"], format: date-time }
        affectedUnits: { type: integer }
        notes: { type: string }

    OverviewActivityStream:
      type: object
      required: [generatedAt, items]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OverviewActivityItem" }
        nextCursor:
          type: ["string", "null"]
          format: date-time
          description: Cursor for the next page (the createdAt of the last item). Null when there are no more items.

    OverviewActivityItem:
      type: object
      required: [id, kind, summary, severity, createdAt]
      properties:
        id: { type: string }
        kind: { type: string }
        summary: { type: string }
        severity:
          type: string
          enum: [info, watch, warning, critical]
        nodeId: { type: ["string", "null"] }
        nodeName: { type: ["string", "null"] }
        itemId: { type: ["string", "null"] }
        orderId: { type: ["string", "null"] }
        actorRole: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        deeplink: { type: ["string", "null"] }

    MissionRiskMatrix:
      type: object
      required: [generatedAt, missions, supplyColumns, cells]
      properties:
        generatedAt: { type: string, format: date-time }
        missions:
          type: array
          items: { $ref: "#/components/schemas/MissionRow" }
        supplyColumns:
          type: array
          items: { $ref: "#/components/schemas/MissionSupplyColumn" }
        cells:
          type: array
          items: { $ref: "#/components/schemas/MissionRiskCell" }

    MissionRow:
      type: object
      required: [id, label, siteCount]
      properties:
        id: { type: string }
        label: { type: string }
        siteCount: { type: integer }

    MissionSupplyColumn:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }

    MissionRiskCell:
      type: object
      required: [missionId, columnId, tier, affectedSites, rationale, metricValue]
      properties:
        missionId: { type: string }
        columnId: { type: string }
        tier: { type: string, enum: [NOMINAL, WATCH, CRITICAL] }
        affectedSites: { type: integer }
        rationale: { type: string }
        metricValue: { type: number }

    AiOverviewBrief:
      type: object
      required: [generatedAt, provider, model, cached, fallback, bullets]
      properties:
        generatedAt: { type: string, format: date-time }
        provider: { type: string }
        model: { type: string }
        cached: { type: boolean }
        fallback:
          type: boolean
          description: True when the AI provider was unreachable and a deterministic fallback brief was used.
        bullets:
          type: object
          required: [topRisk, recommendedAction, change]
          properties:
            topRisk: { type: string }
            recommendedAction: { type: string }
            change: { type: string }
        rawText:
          type: ["string", "null"]
          description: Raw model response text (null when fallback was used).
