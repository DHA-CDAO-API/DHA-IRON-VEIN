        itemId: { type: string }
        quantity: { type: number }
        priority: { type: string }
        rationale: { type: ["string", "null"] }
        sourceRecommendationId: { type: ["string", "null"] }
        requestedDeliveryAt:
          type: string
          format: date-time
          description: ISO timestamp for the requested delivery date. Defaults to 7 days from creation if omitted.

    UpdateOrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [SUBMITTED, ACKNOWLEDGED, IN_TRANSIT, RECEIVED]
        priority:
          type: string
          enum: [ROUTINE, PRIORITY, URGENT, FLASH]
        note: { type: ["string", "null"] }
      anyOf:
        - required: [status]
        - required: [priority]

    Alert:
      type: object
      required: [id, severity, status, title, body, nodeId, itemId, createdAt]
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, watch, warn, critical] }
        status: { type: string, enum: [open, acknowledged, resolved] }
        title: { type: string }
        body: { type: string }
        nodeId: { type: ["string", "null"] }
        nodeName: { type: ["string", "null"] }
        itemId: { type: ["string", "null"] }
        itemName: { type: ["string", "null"] }
        category: { type: string }
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: ["string", "null"], format: date-time }
        acknowledgedBy: { type: ["string", "null"] }

    AcknowledgeAlertInput:
      type: object
