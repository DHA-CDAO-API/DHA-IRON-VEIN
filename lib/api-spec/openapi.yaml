        networkDaysOfSupplyAfter: { type: number }
        peakDemandMultiplier: { type: number }
        avgRoutingLatency: { type: number }
        confidenceScore: { type: number }

    ScenarioNodeOutcome:
      type: object
      required: [nodeId, nodeName, daysOfSupplyBefore, daysOfSupplyAfter, peakShortageDay, criticalItemIds]
      properties:
        nodeId: { type: string }
        nodeName: { type: string }
        daysOfSupplyBefore: { type: number }
        daysOfSupplyAfter: { type: number }
        peakShortageDay: { type: ["integer", "null"] }
        criticalItemIds:
          type: array
          items: { type: string }
        riskScore: { type: number }

    ScenarioItemOutcome:
      type: object
      required: [itemId, itemName, peakDemandPerDay, totalShortfall, recommendedReorder]
      properties:
        itemId: { type: string }
        itemName: { type: string }
        peakDemandPerDay: { type: number }
        totalShortfall: { type: number }
        recommendedReorder: { type: number }

    ScenarioTimelinePoint:
      type: object
      required: [day, networkDaysOfSupply, openShortages, demandIndex]
      properties:
        day: { type: integer }
        networkDaysOfSupply: { type: number }
        openShortages: { type: integer }
        demandIndex: { type: number }

    Recommendation:
      type: object
      required: [id, kind, nodeId, itemId, quantity, priority, rationale, suggestedSupplierId, etaDays, generatedAt]
      properties:
